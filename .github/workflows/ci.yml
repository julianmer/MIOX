name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -m "not data"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - uses: actions/cache@v4
        id: data
        with:
          path: tests/data
          key: test-data-subset-${{ hashFiles('scripts/fetch_test_data.py') }}
      - if: steps.data.outputs.cache-hit != 'true'
        run: uv run python scripts/fetch_test_data.py
      - run: uv run pytest -m data tests/golden/test_golden.py
      - run: uv run python scripts/build_coverage.py
