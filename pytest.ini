[pytest]
# Pytest configuration for Miox

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    -ra

markers =
    data: Tests that need the public test data under tests/data (scripts/fetch_test_data.py)

testpaths = tests

norecursedirs = .git dist build *.egg tests/data docs __pycache__

minversion = 3.11
